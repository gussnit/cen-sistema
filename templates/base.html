<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#397f85"><title>CEN | Portal Escolar</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="app"><header class="top"><a class="brand" href="{{url_for('home')}}"><img class="logo-image" src="{{ url_for('static',filename='logo-cen.png') }}" alt="Logotipo oficial do Centro Educacional de Niterói"><span>CENTRO EDUCACIONAL<br>DE NITERÓI</span></a>{% if me %}<form action="{{url_for('logout')}}" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="plain">Sair ↗</button></form>{% endif %}</header>{% with msgs=get_flashed_messages(with_categories=true) %}{% for kind,msg in msgs %}<div class="alert">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}{% if me %}<nav class="nav"><a href="{{url_for('home')}}">⌂<small>Início</small></a><a href="{{url_for('mural')}}">♧<small>Mural</small></a>{% if me.role=='admin' %}<a href="{{url_for('admin')}}">⚙<small>Admin</small></a>{% endif %}</nav>{% endif %}</main></body></html>
